spring:
  application:
    name: taskflow-api
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_db
    username: postgres
    password: qud$i@12

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: yourVeryStrongSecretKeyForJwtAuthenticationMustBeLong
  expiration: 86400000